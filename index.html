<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b54e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0c14" media="(prefers-color-scheme: dark)" />
    <title>在线差异对比工具</title>
    <meta name="description" content="在线文本、代码、文件与图片差异对比工具，纯前端运行，数据不上传服务器。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // 渲染前解析生效主题并写入 <html data-theme>，避免刷新闪烁。
      // 存储的是偏好 pref：'auto'（默认，跟随系统）| 'light' | 'dark'
      // data-theme 始终是解析后的生效值：'light' | 'dark'
      (function () {
        var pref = 'auto'
        try {
          var saved = JSON.parse(localStorage.getItem('diff-checker:theme'))
          if (saved === 'light' || saved === 'dark' || saved === 'auto') pref = saved
        } catch (e) {}
        var sysDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        var effective = pref === 'auto' ? (sysDark ? 'dark' : 'light') : pref
        document.documentElement.setAttribute('data-theme', effective)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
